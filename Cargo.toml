[package]
name = "bitvmx-wallet"
version = "0.8.4"
edition = "2021"
readme = "README.md"

[dependencies]
bitvmx-protocol-builder = { git = "https://github.com/FairgateLabs/rust-bitvmx-protocol-builder.git", tag = "v0.8.4" }
rust-bitvmx-storage-backend = { git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", tag = "v0.8.4" }
bitvmx-bitcoin-rpc = { git = "https://github.com/FairgateLabs/rust-bitvmx-bitcoin-rpc.git", tag = "v0.8.4" }
bitvmx-key-manager = { git = "https://github.com/FairgateLabs/rust-bitvmx-key-manager.git", tag = "v0.8.4" }
bitvmx-settings = { git = "https://github.com/FairgateLabs/rust-bitvmx-settings.git", tag = "v0.8.4" }
thiserror = "2.0.20"
bitcoin = { version = "0.32.102", features = ["std", "rand-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = "1.0.229"
serde_json = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls-no-provider",
] }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29.0", optional = true }
bdk_wallet = { version = "3.1.0", features = ["rusqlite"] }
bdk_bitcoind_rpc = "0.22.0"
ctrlc = "3.5.2"

[features]
ui = ["dep:crossterm", "dep:ratatui"]

[dev-dependencies]
bitcoind = { git = "https://github.com/FairgateLabs/rust-bitcoind.git", tag = "v0.8.4" }
assert_cmd = "2.2.2"
predicates = "3.1.4"
redact = { version = "0.1", features = ["serde", "zeroize"] }

[lib]
name = "bitvmx_wallet"
path = "src/lib.rs"

[[bin]]
name = "wallet"
path = "src/wallet/main.rs"

[[bin]]
name = "classic"
path = "src/classic_wallet/main.rs"
